<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #030712;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }
    .splash {
      text-align: center;
      animation: fadeIn 0.5s ease-out;
    }
    .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 0 40px rgba(59,130,246,0.3);
      animation: pulse 2s ease-in-out infinite;
    }
    .logo-text {
      font-size: 36px;
      font-weight: 900;
      color: white;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 32px;
    }
    .loader {
      width: 160px;
      height: 3px;
      background: rgba(255,255,255,0.06);
      border-radius: 3px;
      margin: 0 auto;
      overflow: hidden;
    }
    .loader-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      border-radius: 3px;
      animation: load 2s ease-in-out forwards;
    }
    .version {
      font-size: 10px;
      color: #475569;
      margin-top: 20px;
    }
    .developer {
      font-size: 10px;
      color: #334155;
      margin-top: 8px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 40px rgba(59,130,246,0.3); }
      50% { box-shadow: 0 0 60px rgba(59,130,246,0.5); }
    }
    @keyframes load {
      0% { width: 0%; }
      50% { width: 70%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo">
      <span class="logo-text">₺</span>
    </div>
    <h1>Finansal Hesaplaci</h1>
    <p class="subtitle">Turk mali hesaplayici</p>
    <div class="loader">
      <div class="loader-bar"></div>
    </div>
    <p class="version">v2.1.4</p>
    <p class="developer">Developer: Arda M. Ekiz</p>
  </div>
</body>
</html>
