<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(145deg, #0a0f1a 0%, #0d1424 50%, #0a0f1a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }

    .particles {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(99,102,241,0.4);
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
    }
    .particle:nth-child(1) { left:10%; top:20%; animation-delay:0s; animation-duration:5s; }
    .particle:nth-child(2) { left:80%; top:15%; animation-delay:1s; animation-duration:7s; width:3px; height:3px; }
    .particle:nth-child(3) { left:25%; top:75%; animation-delay:2s; animation-duration:6s; }
    .particle:nth-child(4) { left:70%; top:80%; animation-delay:0.5s; animation-duration:8s; width:1px; height:1px; }
    .particle:nth-child(5) { left:50%; top:40%; animation-delay:3s; animation-duration:5.5s; }
    .particle:nth-child(6) { left:15%; top:55%; animation-delay:1.5s; animation-duration:6.5s; width:2px; height:2px; }
    .particle:nth-child(7) { left:85%; top:60%; animation-delay:2.5s; animation-duration:7.5s; }
    .particle:nth-child(8) { left:40%; top:10%; animation-delay:0.8s; animation-duration:5.8s; width:1px; height:1px; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
      50% { transform: translateY(-20px) scale(1.5); opacity: 0.8; }
    }

    .splash {
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .logo-container {
      width: 96px;
      height: 96px;
      margin: 0 auto 28px;
      position: relative;
      animation: dropIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
    }

    @keyframes dropIn {
      0% { opacity: 0; transform: translateY(-30px) scale(0.8); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .logo-ring {
      position: absolute;
      inset: -8px;
      border: 2px solid rgba(99,102,241,0.15);
      border-radius: 24px;
      animation: ringPulse 3s ease-in-out infinite;
    }

    .logo-ring:nth-child(2) {
      inset: -16px;
      border-color: rgba(99,102,241,0.08);
      animation-delay: 0.5s;
    }

    @keyframes ringPulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    .logo {
      width: 96px;
      height: 96px;
      background: linear-gradient(135deg, #3b82f6 0%, #6366f1 50%, #8b5cf6 100%);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow:
        0 0 30px rgba(99,102,241,0.3),
        0 0 60px rgba(99,102,241,0.15),
        0 20px 40px rgba(0,0,0,0.4);
      animation: logoGlow 3s ease-in-out infinite;
    }

    @keyframes logoGlow {
      0%, 100% { box-shadow: 0 0 30px rgba(99,102,241,0.3), 0 0 60px rgba(99,102,241,0.15), 0 20px 40px rgba(0,0,0,0.4); }
      50% { box-shadow: 0 0 40px rgba(99,102,241,0.5), 0 0 80px rgba(99,102,241,0.25), 0 20px 40px rgba(0,0,0,0.4); }
    }

    .logo-text {
      font-size: 40px;
      font-weight: 900;
      color: white;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
      animation: symbolSpin 0.6s ease-out 0.3s forwards;
      opacity: 0;
      transform: rotate(-20deg);
    }

    @keyframes symbolSpin {
      0% { opacity: 0; transform: rotate(-20deg) scale(0.5); }
      100% { opacity: 1; transform: rotate(0deg) scale(1); }
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
      animation: slideUp 0.6s ease-out 0.4s forwards;
      opacity: 0;
      transform: translateY(10px);
    }

    .subtitle {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 36px;
      letter-spacing: 1px;
      text-transform: uppercase;
      animation: slideUp 0.6s ease-out 0.5s forwards;
      opacity: 0;
      transform: translateY(10px);
    }

    @keyframes slideUp {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .loader-container {
      animation: slideUp 0.6s ease-out 0.6s forwards;
      opacity: 0;
      transform: translateY(10px);
    }

    .loader {
      width: 180px;
      height: 3px;
      background: rgba(255,255,255,0.05);
      border-radius: 4px;
      margin: 0 auto;
      overflow: hidden;
      position: relative;
    }

    .loader-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #6366f1, #8b5cf6);
      border-radius: 4px;
      animation: load 2.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      position: relative;
    }

    .loader-bar::after {
      content: '';
      position: absolute;
      right: 0;
      top: -3px;
      width: 9px;
      height: 9px;
      background: #8b5cf6;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(139,92,246,0.8);
      animation: dotGlow 0.3s ease-in-out infinite alternate;
    }

    @keyframes dotGlow {
      0% { box-shadow: 0 0 8px rgba(139,92,246,0.6); }
      100% { box-shadow: 0 0 16px rgba(139,92,246,1); }
    }

    @keyframes load {
      0% { width: 0%; }
      30% { width: 40%; }
      60% { width: 70%; }
      100% { width: 100%; }
    }

    .footer-info {
      animation: slideUp 0.6s ease-out 0.8s forwards;
      opacity: 0;
      transform: translateY(10px);
      margin-top: 28px;
    }

    .version {
      font-size: 11px;
      color: #475569;
      font-weight: 500;
    }

    .developer {
      font-size: 10px;
      color: #334155;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <div class="splash">
    <div class="logo-container">
      <div class="logo-ring"></div>
      <div class="logo-ring"></div>
      <div class="logo">
        <span class="logo-text">₺</span>
      </div>
    </div>

    <h1>Finansal Hesaplaci</h1>
    <p class="subtitle">Turk mali hesaplayici</p>

    <div class="loader-container">
      <div class="loader">
        <div class="loader-bar"></div>
      </div>
    </div>

    <div class="footer-info">
      <p class="version">v2.1.5</p>
      <p class="developer">Developer: Arda M. Ekiz</p>
    </div>
  </div>
</body>
</html>
