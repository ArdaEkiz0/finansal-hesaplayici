<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #060a13;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }

    .splash {
      width: 360px;
      text-align: center;
      position: relative;
    }

    .bg-glow {
      position: absolute;
      width: 220px; height: 220px;
      border-radius: 50%;
      filter: blur(80px);
      top: -50px; left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle, #6366f1, transparent 70%);
      animation: breathe 4s ease-in-out infinite;
    }
    @keyframes breathe {
      0%,100% { opacity: 0.06; transform: translateX(-50%) scale(1); }
      50%     { opacity: 0.16; transform: translateX(-50%) scale(1.12); }
    }

    .logo-wrap {
      position: relative;
      width: 88px; height: 88px;
      margin: 0 auto 20px;
    }
    .logo-ring {
      position: absolute; inset: 0;
      border: 1.5px solid rgba(99,102,241,0.12);
      border-radius: 20px;
      animation: ringBreath 3s ease-in-out infinite;
    }
    .logo-ring.r2 {
      inset: -10px;
      border-color: rgba(99,102,241,0.06);
      animation-delay: .6s;
    }
    @keyframes ringBreath {
      0%,100% { transform: scale(1);   opacity: .4; }
      50%     { transform: scale(1.06); opacity: .9; }
    }

    .logo {
      width: 88px; height: 88px;
      background: linear-gradient(135deg,#3b82f6,#6366f1 50%,#8b5cf6);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      box-shadow: 0 0 24px rgba(99,102,241,.25), 0 0 48px rgba(99,102,241,.12), 0 16px 32px rgba(0,0,0,.4);
      animation: logoGlow 3s ease-in-out infinite;
    }
    @keyframes logoGlow {
      0%,100% { box-shadow: 0 0 24px rgba(99,102,241,.25), 0 0 48px rgba(99,102,241,.12), 0 16px 32px rgba(0,0,0,.4); }
      50%     { box-shadow: 0 0 36px rgba(99,102,241,.45), 0 0 64px rgba(99,102,241,.20), 0 16px 32px rgba(0,0,0,.4); }
    }

    .logo-symbol {
      font-size: 38px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,.3);
    }

    .title {
      font-size: 20px; font-weight: 700;
      color: #f1f5f9; letter-spacing: -.4px;
      margin-bottom: 4px;
      opacity: 0;
      animation: fadeUp .5s ease-out .25s forwards;
    }
    .sub {
      font-size: 11px; color: #4b5e78;
      letter-spacing: 1.5px; text-transform: uppercase;
      margin-bottom: 26px;
      opacity: 0;
      animation: fadeUp .5s ease-out .35s forwards;
    }
    @keyframes fadeUp {
      from { opacity:0; transform: translateY(8px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .bar-wrap {
      width: 180px; height: 3px;
      background: rgba(255,255,255,.04);
      border-radius: 4px;
      margin: 0 auto;
      overflow: visible;
      position: relative;
      opacity: 0;
      animation: fadeUp .5s ease-out .45s forwards;
    }
    .bar {
      height: 100%; width: 0%;
      background: linear-gradient(90deg,#3b82f6,#6366f1,#8b5cf6);
      border-radius: 4px;
      animation: fill 2s cubic-bezier(.4,0,.2,1) .55s forwards;
      position: relative;
    }
    .bar::after {
      content: '';
      position: absolute;
      right: -4px; top: -3px;
      width: 9px; height: 9px;
      background: #a78bfa;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(167,139,250,.7), 0 0 20px rgba(167,139,250,.3);
    }
    @keyframes fill {
      0%   { width: 0%; }
      40%  { width: 50%; }
      70%  { width: 78%; }
      100% { width: 100%; }
    }

    .foot {
      margin-top: 22px;
      opacity: 0;
      animation: fadeUp .5s ease-out .65s forwards;
    }
    .ver { font-size: 11px; color: #475569; font-weight: 500; }
    .dev { font-size: 10px; color: #334155; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="splash">
    <div class="bg-glow"></div>
    <div class="logo-wrap">
      <div class="logo-ring"></div>
      <div class="logo-ring r2"></div>
      <div class="logo">
        <span class="logo-symbol">₺</span>
      </div>
    </div>
    <div class="title">Finansal Hesaplaci</div>
    <div class="sub">Turk mali hesaplayici</div>
    <div class="bar-wrap">
      <div class="bar"></div>
    </div>
    <div class="foot">
      <div class="ver">v2.1.6</div>
      <div class="dev">Developer: Arda M. Ekiz</div>
    </div>
  </div>
</body>
</html>
