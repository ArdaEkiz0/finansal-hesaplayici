[workspace]
resolver = "2"
members = [
    "crates/fh-core",
    "crates/fh-data",
    "crates/fh-ui",
    "crates/fh-updater",
]

[workspace.package]
version = "5.7.6"
edition = "2024"
authors = ["Arda M. Ekiz"]
license = "MIT"
description = "Turk mali hesaplayici - Rust native"

[workspace.dependencies]
rust_decimal = { version = "1", features = ["serde", "maths"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
hex = "0.4"
zip = "2"
# Lisans/deneme karar çekirdeği (LISANS_SOZLESMESI §10) — sabit rev, public repo;
# CI'ın indirebilmesi için PUBLIC olmak zorunda (doğrulama-only, imza üretmez).
muhasebe-lisans = { git = "https://github.com/ArdaEkiz0/muhasebe-lisans", rev = "81ea31d85b8df6c15aefe5a76b5a84bd8731be10" }

# Tersten mühendisliği pahalılaştır: sembol tablosu yok, ince LTO, tek
# codegen birimi. Testler dev profilinde koştuğu için davranış değişmez;
# yalnız release ikilisi küçülür ve analize daha az isim sızdırır.
# CI etiket derlemesini etkiler; bir sonraki release'te devreye girer.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
