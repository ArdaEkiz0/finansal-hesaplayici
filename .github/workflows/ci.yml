name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: DKK testleri
        run: npm test

      - name: Derleme
        run: npm run build
        env:
          VITE_CONFIG_NATIVE_IGNORE_WARNING: "true"

      - name: Electron derlemesi
        run: npx vite build --config vite.config.electron.ts
        env:
          VITE_CONFIG_NATIVE_IGNORE_WARNING: "true"

      # Tag push'larında (sürüm): portable exe + update.zip → GitHub Release
      - name: Sürüm eşleşme kontrolü
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$v" -ne "$env:GITHUB_REF_NAME") { throw "Etiket $env:GITHUB_REF_NAME, package.json v$v ile uyumsuz — sürümü yükseltin" }

      - name: Sürüm paketleme
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --win portable "-c.directories.output=${{ github.workspace }}\dist-rel"
        env:
          VITE_CONFIG_NATIVE_IGNORE_WARNING: "true"

      - name: release hazırla
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $stage = "dist-rel/package"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse -Force dist "$stage/dist"
          Copy-Item -Recurse -Force dist-electron "$stage/dist-electron"
          Copy-Item -Force package.json "$stage/package.json"
          Compress-Archive -Path $stage -DestinationPath "dist-rel/update.zip" -Force
          (Get-FileHash "dist-rel/update.zip" -Algorithm SHA256).Hash.ToLower() | Set-Content "dist-rel/update.zip.sha256" -NoNewline
          Get-ChildItem dist-rel

      - name: Sürüm dosyalarını yükle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: surum-dosyalari
          path: |
            dist-rel/*.exe
            dist-rel/update.zip
            dist-rel/update.zip.sha256

  release:
    # Yazma izni yalnizca yayin isine verilir; derleme/test adimlari
    # contents: read ile calisir.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: surum-dosyalari
          path: dist-rel

      - name: Release yükle
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-rel/*.exe
            dist-rel/update.zip
            dist-rel/update.zip.sha256
          generate_release_notes: true

