name: CI (Rust)

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Workspace testleri
        run: cargo test --workspace

      - name: Release derlemesi
        run: cargo build --release

      - name: Surum eslesme kontrolu
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '(?m)^[ \t]*version[ \t]*=[ \t]*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if (-not $v) { throw "Cargo.toml icinde surum okunamadi" }
          if ("v$v" -ne "$env:GITHUB_REF_NAME") { throw "Etiket $env:GITHUB_REF_NAME, Cargo.toml v$v ile uyumsuz — surumu yukseltin" }
          "version=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Inno Setup 6 (kurulum exe icin)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $adaylar = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $bulunan = $adaylar | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $bulunan) { throw "ISCC.exe kurulumdan sonra bulunamadi" }
          "Bulunan: $bulunan"

      - name: Surum dosyalarini hazirla
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = $env:version
          $exe = "target\release\Finansal_Hesaplayici.exe"
          if (-not (Test-Path $exe)) { throw "Derlenen exe bulunamadi: $exe" }

          $stage = "dist-rel"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # Portable exe: derlenen exenin birebir kopyasi.
          Copy-Item -Force $exe "$stage\Finansal-Hesaplayici-$v-portable.exe"

          # NSIS degil Inno Setup ile tek tik kurulum exe'si.
          $iscc = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup 6 (ISCC.exe) bulunamadi" }
          & $iscc "Kurulum\FH_kurulum.iss" "/DSurum=$v"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup derlemesi basarisiz" }
          $setup = "target\installer\Finansal-Hesaplayici-$v-setup.exe"
          if (-not (Test-Path $setup)) { throw "Kurulum exe'si uretilmedi" }
          Copy-Item -Force $setup "$stage\Finansal-Hesaplayici-$v-kurulum.exe"

          # update.zip: exe + gerekli dosyalar (guncelleyici icin).
          $pkg = "$stage\update-pkg"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item -Force $exe "$pkg\Finansal Hesaplayici.exe"
          if (Test-Path "build\icon.ico") { Copy-Item -Force "build\icon.ico" "$pkg\icon.ico" }
          Compress-Archive -Path "$pkg\*" -DestinationPath "$stage\update.zip" -Force

          $hash = (Get-FileHash "$stage\update.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$stage\update.zip.sha256" -Value $hash -NoNewline
          Get-ChildItem $stage

      - name: Surum dosyalarini yukle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: surum-dosyalari
          path: |
            dist-rel/*.exe
            dist-rel/update.zip
            dist-rel/update.zip.sha256

  release:
    # Implicit publish yok: yalnizca bu is yazma iznine sahip ve gh CLI ile
    # kontrollu sekilde create/upload yapilir.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: surum-dosyalari
          path: dist-rel

      - name: Release (kontrollu yukleme)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Surumun TEK kaynagi Cargo.toml; etiket ona gore dogrulanir.
          # (build isinde de ayni kontrol var — burada tekrar, savunma icin.)
          $ver = (Select-String -Path Cargo.toml -Pattern '(?m)^[ \t]*version[ \t]*=[ \t]*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if (-not $ver) { throw "Cargo.toml icinde surum okunamadi" }
          if ("v$ver" -ne "$env:GITHUB_REF_NAME") { throw "Etiket $env:GITHUB_REF_NAME, Cargo.toml v$ver ile uyumsuz" }
          $tag = $env:GITHUB_REF_NAME
          $files = @(
            "dist-rel\Finansal-Hesaplayici-$ver-kurulum.exe",
            "dist-rel\Finansal-Hesaplayici-$ver-portable.exe",
            "dist-rel\update.zip",
            "dist-rel\update.zip.sha256"
          )
          foreach ($f in $files) { if (-not (Test-Path $f)) { throw "Eksik release dosyasi: $f" } }

          gh release view $tag --repo $env:GITHUB_REPOSITORY > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $files --title "Finansal Hesaplayici $tag" --generate-notes --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release komutu basarisiz" }
