[package]
name = "fh-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true

# NOT: Cargo/rustc 1.99 boşluklu bin adını `--crate-name` olarak doğrudan rustc'a
# geçirir ve rustc boşluğu reddeder. Sözleşmedeki "Finansal Hesaplayici" adı
# aşağıda hedef olarak korunur; derlenen çıktı `Finansal_Hesaplayici` alias'ı ile
# üretilir (aynı kaynak dosya).
[features]
default = []
_bin_adi_devre_disi = []

[[bin]]
name = "Finansal Hesaplayici"
path = "src/dev_bin.rs"
required-features = ["_bin_adi_devre_disi"]

[[bin]]
name = "Finansal_Hesaplayici"
path = "src/main.rs"

[dependencies]
fh-core = { path = "../fh-core" }
fh-data = { path = "../fh-data" }
fh-updater = { path = "../fh-updater" }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard"] }
serde = { workspace = true }
serde_json = { workspace = true }
rust_decimal = { workspace = true }
chrono = { workspace = true }
dirs = "7"
rfd = "0.15"
arboard = "3"

[build-dependencies]
# Windows exe'sine ikon + sürüm/şirket bilgisi kaynağı ekler (profesyonel Özellikler).
winres = "0.1"
